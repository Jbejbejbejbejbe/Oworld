<!DOCTYPE html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="utf-8">
		<title>歐世界</title>
		<link rel="stylesheet" href="signupC.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" rel="stylesheet">
	</head>
	<body>
		<p class="btext">SIGN UP</p>
		<div class="all">
			<div class="welcome">
				<p class="weltext">歡迎加入</p>
			</div>
			<form id="userdata" name="signup">
				<label for="username" class="nametext">帳號名稱</label>
				<input type="text" name="username" class="accountname" id="username">
				<br>
				<label for="password" class="passtext">密碼</label>
				<input type="password" name="password" class="password" id="password">
				<br>
				<div class="pchdiv">
					<label for="passwordcheck" class="checktext">密碼確認</label>
				</div>
				<input type="password" name="passwordcheck" class="passwordcheck" id="passwordcheck">
				<br>
				<button type="submit" class="submit">註冊</button>
			</form>
			<div class="aldiv">
				<p class="already">已經有帳號了嗎？</p>
			</div>
			<div class="login">
				<p class="logintext">登入！</p>
			</div>
		</div>
		<script src="signupJ.js" type="module"></script>
	</body>
</html>
